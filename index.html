<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CTS Prep has moved</title>
<link rel="canonical" href="../CTS-Prep/">
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#101827;color:#f8fafc;font-family:system-ui,sans-serif;text-align:center;padding:24px}
  a{display:inline-block;margin-top:16px;padding:14px 22px;border-radius:16px;background:#0284c7;color:#fff;font-weight:800;text-decoration:none}
</style>
</head>
<body>
<main>
  <h1>CTS Prep has moved</h1>
  <p>CTS Prep Hub is now part of CTS Prep. Your progress on this device carries over.</p>
  <a href="../CTS-Prep/">Open CTS Prep</a>
</main>
<script>
// Retire this copy's offline worker, then go to the merged app.
(function () {
  function go() { location.replace('../CTS-Prep/'); }
  if ('serviceWorker' in navigator && navigator.serviceWorker.getRegistrations) {
    navigator.serviceWorker.getRegistrations().then(function (regs) {
      return Promise.all(regs.filter(function (r) { return r.scope.indexOf('/CTS-Prep-Hub/') >= 0; })
        .map(function (r) { return r.unregister(); }));
    }).then(go, go);
    setTimeout(go, 2500);
  } else go();
})();
</script>
</body>
</html>
